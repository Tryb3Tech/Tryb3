<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Tryb3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles/global.css"/>
  <!-- Firebase SDK (replace config below with your own from Firebase Console) -->
  <script type="module">
    console.log("Login script loaded");
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    /* ─────────────────────────────────────────────────────────
       STEP 1: Replace this with your Firebase project config.
       Go to: Firebase Console → Project Settings → Your Apps
    ───────────────────────────────────────────────────────── */
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBmqbaUw1WgZ1BGa_AK-EyrqbTHde6e3To",
  authDomain: "tryb3website.firebaseapp.com",
  projectId: "tryb3website",
  storageBucket: "tryb3website.firebasestorage.app",
  messagingSenderId: "197458140763",
  appId: "1:197458140763:web:731cf78237b888c98be97e",
  measurementId: "G-4ZDJEB79NP"
};

console.log("Firebase is connected");

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── TAB SWITCHING ──
    window.showTab = function(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
      clearMessages();
    };

    function setMessage(msg, isError = true) {
      const el = document.getElementById('authMessage');
      el.textContent = msg;
      el.style.color = isError ? '#c0392b' : 'var(--burgundy)';
      el.style.display = 'block';
    }

    function clearMessages() {
      document.getElementById('authMessage').style.display = 'none';
    }

    // ── LOGIN ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  // ✅ ADD THIS VALIDATION
  if (!email || !password) {
    setMessage('Please enter both email and password.');
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = 'account.html';
  } catch (err) {
    setMessage(friendlyError(err.code));
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
  }
});

      // ── SIGN UP ──
      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name     = document.getElementById('signupName').value.trim();
        const email    = document.getElementById('signupEmail').value.trim();
        const phone    = document.getElementById('signupPhone').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm  = document.getElementById('signupConfirm').value;
        const btn      = document.getElementById('signupBtn');

        if (password !== confirm) { setMessage('Passwords do not match.'); return; }
        if (password.length < 6)  { setMessage('Password must be at least 6 characters.'); return; }

        btn.disabled = true; btn.textContent = 'Creating account…';

        try {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          // Save profile to Firestore
          await setDoc(doc(db, 'customers', cred.user.uid), {
            name, email, phone,
            createdAt: new Date().toISOString(),
            orders: []
          });
          window.location.href = 'account.html';
        } catch (err) {
          setMessage(friendlyError(err.code));
          btn.disabled = false; btn.textContent = 'CREATE ACCOUNT';
        }
      });

      // ── FORGOT PASSWORD ──
      document.getElementById('forgotLink').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) { setMessage('Enter your email first, then click Forgot Password.'); return; }
        try {
          await sendPasswordResetEmail(auth, email);
          setMessage('Password reset email sent. Check your inbox.', false);
        } catch (err) {
          setMessage(friendlyError(err.code));
        }
      });

    function friendlyError(code) {
      const map = {
        'auth/user-not-found':        'No account found with this email.',
        'auth/wrong-password':        'Incorrect password. Try again.',
        'auth/email-already-in-use':  'This email is already registered. Sign in instead.',
        'auth/invalid-email':         'Please enter a valid email address.',
        'auth/weak-password':         'Password is too weak. Use at least 6 characters.',
        'auth/too-many-requests':     'Too many attempts. Try again in a moment.',
        'auth/network-request-failed':'Network error. Check your connection.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }
  </script>
  <style>
    .login-page {
      padding-top: 72px;
      min-height: 100vh;
      background: var(--ivory-dark);
      display: flex;
      flex-direction: column;
    }

    .login-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 72px);
    }

    /* Left decorative panel */
    .login-art {
      background: var(--burgundy);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }

    .login-art::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(240,232,216,0.1);
    }

    .login-art::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(240,232,216,0.06);
    }

    .login-art-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(240,232,216,0.5);
      margin-bottom: 24px;
    }

    .login-art h2 {
      font-size: clamp(36px, 4vw, 56px);
      font-weight: 700;
      color: var(--ivory);
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .login-art h2 em { font-style: italic; color: var(--ivory-dark); }

    .login-art p {
      font-size: 14px;
      font-style: italic;
      color: rgba(240,232,216,0.55);
      line-height: 1.8;
      max-width: 360px;
    }

    /* Right form panel */
    .login-form-side {
      background: var(--ivory-warm);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 80px;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 40px;
    }

    .auth-tab {
      flex: 1;
      font-family: 'Playfair Display', serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      padding: 14px;
      border: 0.5px solid rgba(107,26,42,0.2);
      background: none;
      cursor: pointer;
      color: var(--text-mid);
      transition: all 0.2s;
      text-align: center;
    }

    .auth-tab.active {
      background: var(--burgundy);
      color: var(--ivory);
      border-color: var(--burgundy);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 9px;
      letter-spacing: 2.5px;
      color: var(--burgundy);
      opacity: 0.7;
    }

    .form-input {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--text-dark);
      background: var(--ivory-warm);
      border: 0.5px solid rgba(107,26,42,0.25);
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .form-input:focus { border-color: var(--burgundy); }

    .auth-btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      letter-spacing: 3px;
      background: var(--burgundy);
      color: var(--ivory);
      border: none;
      padding: 18px;
      cursor: pointer;
      transition: background 0.25s;
    }

    .auth-btn:hover { background: var(--burgundy-deep); }
    .auth-btn:disabled { opacity: 0.6; cursor: default; }

    .forgot-link {
      font-size: 11px;
      font-style: italic;
      color: var(--burgundy);
      text-decoration: none;
      opacity: 0.7;
      margin-top: 12px;
      display: inline-block;
      transition: opacity 0.2s;
    }

    .forgot-link:hover { opacity: 1; }

    .auth-message {
      font-size: 13px;
      font-style: italic;
      margin-top: 16px;
      display: none;
      line-height: 1.5;
    }

    .divider-line {
      border: none;
      border-top: 0.5px solid rgba(107,26,42,0.12);
      margin: 24px 0;
    }

    .guest-note {
      font-size: 12px;
      font-style: italic;
      color: var(--text-mid);
      opacity: 0.6;
      text-align: center;
      line-height: 1.7;
    }

    .guest-note a {
      color: var(--burgundy);
      text-decoration: none;
      border-bottom: 0.5px solid var(--burgundy);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .login-wrap { grid-template-columns: 1fr; }
      .login-art { display: none; }
      .login-form-side { padding: 40px 24px 64px; }
    }
  </style>
</head>
<body class="login-page">

  <!-- NAV -->
  <nav>
    <div class="logo">
      <a href="index.html"><img src="images/logo.png" alt="Tryb3" onerror="this.style.display='none';"></a>
    </div>
    <ul class="nav-links">
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a href="cart.html" class="nav-icon nav-cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </nav>

  <div class="login-wrap">

    <!-- LEFT: Art panel -->
    <div class="login-art">
      <p class="login-art-label">YOUR ACCOUNT</p>
      <h2>Welcome<br/><em>back.</em></h2>
      <p>Sign in to track your orders, save your details, and reorder your favourite pieces with a single click.</p>
    </div>

    <!-- RIGHT: Form -->
    <div class="login-form-side">

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" onclick="showTab('login')">SIGN IN</button>
        <button class="auth-tab" data-tab="signup" onclick="showTab('signup')">CREATE ACCOUNT</button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="auth-panel active" id="panel-login">
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">EMAIL ADDRESS</label>
            <input class="form-input" type="email" id="loginEmail" required placeholder="your@email.com"/>
          </div>
          <div class="form-group">
            <label class="form-label">PASSWORD</label>
            <input class="form-input" type="password" id="loginPassword" required placeholder="••••••••"/>
          </div>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
          <button class="auth-btn" type="submit" id="loginBtn">SIGN IN</button>
        </form>
      </div>

      <!-- SIGNUP PANEL -->
      <div class="auth-panel" id="panel-signup">
        <form id="signupForm">
          <div class="form-group">
            <label class="form-label">FULL NAME</label>
            <input class="form-input" type="text" id="signupName" required placeholder="Ada Obi"/>
          </div>
          <div class="form-group">
            <label class="form-label">EMAIL ADDRESS</label>
            <input class="form-input" type="email" id="signupEmail" required placeholder="your@email.com"/>
          </div>
          <div class="form-group">
            <label class="form-label">PHONE NUMBER</label>
            <input class="form-input" type="tel" id="signupPhone" placeholder="+234 801 234 5678"/>
          </div>
          <div class="form-group">
            <label class="form-label">PASSWORD</label>
            <input class="form-input" type="password" id="signupPassword" required placeholder="Min. 6 characters"/>
          </div>
          <div class="form-group">
            <label class="form-label">CONFIRM PASSWORD</label>
            <input class="form-input" type="password" id="signupConfirm" required placeholder="Re-enter password"/>
          </div>
          <button class="auth-btn" type="submit" id="signupBtn">CREATE ACCOUNT</button>
        </form>
      </div>

      <p class="auth-message" id="authMessage"></p>

      <hr class="divider-line"/>

      <p class="guest-note">
        Prefer not to create an account?<br/>
        <a href="checkout.html">Continue as a guest →</a>
      </p>

    </div>
  </div>

  <script src="scripts/cart.js"></script>
</body>
</html>
